<!DOCTYPE html>
<!--
  ChronoNote · 智能时间流记事与待办 v1.2.1
  ────────────────────────────────────────────────────────────────
  · 单文件应用：双击即可运行（首屏需联网加载 Vue 3 / Tailwind / Lucide / LocalForage CDN）
  · 存储：任务与图片 → IndexedDB (localforage)；仅 deepseekApiKey / githubToken / gistId / lastIsoWeek 存 localStorage
  · 同步：GitHub Gist 双向增量合并，按 id 比对、updatedAt 取新、删除写成 deleted=true，避免跨端复活
  · 语法：` // ` 之后为子备注（含 URL 自动转为链接备注）；输入框内 Ctrl+V 可直接粘贴图片
-->
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>ChronoNote · 智能时间流</title>

<style>
/* ============================================================
   0. 设计令牌
   ============================================================ */
:root{
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --line:#E2E8F0;
  --line-soft:#EDF1F6;
  --line-strong:#CBD5E1;
  --ink:#0F172A;
  --ink-2:#334155;
  --muted:#64748B;
  --faint:#94A3B8;
  --indigo:#4F46E5;
  --indigo-600:#4338CA;
  --indigo-soft:#EEF2FF;
  --indigo-line:#C7D2FE;
  --coral:#D9534F;
  --coral-soft:#FEF1F0;
  --coral-line:#F8D4D1;
  --amber:#B7791F;
  --amber-soft:#FDF6E9;
  --amber-line:#F2E3C2;
  --slate:#475569;
  --slate-soft:#F1F5F9;
  --green:#0F9D76;
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Instrument Serif",Georgia,"Songti SC",serif;
  --r-card:14px;
  --r-btn:10px;
  --sh-1:0 1px 2px rgba(15,23,42,.05);
  --sh-2:0 2px 4px -2px rgba(15,23,42,.08),0 10px 24px -16px rgba(15,23,42,.30);
  --sh-3:0 24px 60px -24px rgba(15,23,42,.30),0 2px 8px rgba(15,23,42,.06);
  --ease:cubic-bezier(.22,.8,.28,1);
  --dock-h:0px;
}
*,*::before,*::after{box-sizing:border-box}
[v-cloak]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -160px,rgba(79,70,229,.09),rgba(79,70,229,0) 70%),
                   radial-gradient(700px 300px at 100% 0,rgba(183,121,31,.05),rgba(183,121,31,0) 70%);
  background-repeat:no-repeat;
  font-family:var(--sans);font-size:14px;line-height:1.55;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:contain;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,textarea,select{font:inherit;color:inherit;margin:0}
input:focus,textarea:focus,select:focus,button:focus{outline:none}
:focus-visible{outline:2px solid rgba(79,70,229,.42);outline-offset:2px;border-radius:6px}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:rgba(79,70,229,.16)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D9E1EB;border:3px solid transparent;background-clip:padding-box;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#C2CEDC;background-clip:padding-box;border:3px solid transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============================================================
   1. 顶部导航
   ============================================================ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(248,250,252,.80);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1460px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;user-select:none}
.brand .logo{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#5850E8,#3B33C4);
  box-shadow:0 6px 14px -8px rgba(79,70,229,.9),inset 0 1px 0 rgba(255,255,255,.25);
}
.brand-name{font-family:var(--serif);font-size:21px;line-height:1;letter-spacing:.01em;padding-top:2px}
.brand-name em{font-style:italic;color:var(--indigo)}
.search{position:relative;flex:1 1 auto;max-width:420px}
.search input{
  width:100%;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;
  padding:0 30px 0 32px;font-size:12.5px;color:var(--ink);transition:border-color .16s,box-shadow .16s;
  -webkit-appearance:none;appearance:none;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--indigo-line);box-shadow:0 0 0 3px rgba(79,70,229,.09)}
.search input::-webkit-search-cancel-button{display:none}
.search-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;display:flex}
.search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:#EEF2F7}
.search-clear:hover{background:#E2E8F0;color:var(--ink)}
.sync-chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;
  border:1px solid var(--line);background:#fff;font-size:11.5px;color:var(--muted);white-space:nowrap;
  transition:.16s;flex:0 0 auto;margin-left:auto;
}
.sync-chip:hover{border-color:var(--line-strong);color:var(--ink-2)}
.sync-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px rgba(148,163,184,.14)}
.sync-chip.is-ok .dot{background:var(--green);box-shadow:0 0 0 3px rgba(15,157,118,.14)}
.sync-chip.is-syncing .dot{background:var(--indigo);animation:pulse 1s infinite}
.sync-chip.is-error .dot{background:var(--coral);box-shadow:0 0 0 3px rgba(217,83,79,.14)}
.sync-chip.is-off .dot{background:var(--faint)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.icon-btn{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid transparent;transition:.16s;flex:0 0 auto;
}
.icon-btn:hover{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:var(--sh-1)}
.icon-btn:active{transform:scale(.94)}

/* ============================================================
   2. 跨周横幅
   ============================================================ */
.banner-wrap{max-width:1460px;margin:14px auto 0;padding:0 22px;width:100%;animation:rise .45s var(--ease) both}
.banner{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--amber-line);background:linear-gradient(180deg,#FFFCF4,#FEF8EC);
  border-radius:var(--r-card);padding:11px 14px;box-shadow:var(--sh-1);
}
.banner .b-ic{width:28px;height:28px;border-radius:9px;background:#FBEED2;color:var(--amber);display:grid;place-items:center;flex:0 0 auto}
.banner-text{flex:1 1 260px;font-size:12.8px;color:#6B4E17;line-height:1.5}
.banner-text b{font-weight:600;color:#5A3F0C}
.banner-actions{display:flex;gap:8px;flex:0 0 auto}

/* ============================================================
   3. 按钮
   ============================================================ */
.btn{border-radius:var(--r-btn);padding:0 12px;height:30px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.16s;white-space:nowrap}
.btn:hover{border-color:var(--line-strong);box-shadow:var(--sh-1)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#1E293B;border-color:#1E293B}
.btn-accent{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn-accent:hover{background:var(--indigo-600);border-color:var(--indigo-600)}
.btn-amber{background:#fff;border-color:var(--amber-line);color:var(--amber)}
.btn-amber:hover{background:var(--amber-soft)}
.btn-danger{background:#fff;border-color:var(--coral-line);color:var(--coral)}
.btn-danger:hover{background:var(--coral-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn-sm{height:26px;padding:0 10px;font-size:11.5px;border-radius:8px}

/* ============================================================
   4. 快捷输入栏
   ============================================================ */
.composer-wrap{max-width:830px;margin:22px auto 6px;padding:0 22px;width:100%;animation:rise .5s var(--ease) both;animation-delay:.03s}
.composer{width:100%}
.c-previews{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.thumb{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--sh-1)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(15,23,42,.66);color:#fff;display:grid;place-items:center;font-size:11px;line-height:1;backdrop-filter:blur(4px)}
.c-box{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--sh-2);padding:10px 10px 8px 14px;transition:border-color .18s,box-shadow .18s;
}
.c-box:focus-within{border-color:var(--indigo-line);box-shadow:0 0 0 3px rgba(79,70,229,.07),var(--sh-2)}
.c-ta{
  width:100%;border:0;background:transparent;resize:none;display:block;
  font-size:14.5px;line-height:1.6;min-height:26px;max-height:180px;padding:2px 0;color:var(--ink);
}
.c-ta::placeholder{color:#A9B4C2}
.c-actions{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:4px}
.c-actions .icon-btn{color:var(--muted)}
.ai-btn{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;
  border:1px solid #E4E2FB;background:#F8F7FF;color:var(--indigo);font-size:12px;font-weight:500;transition:.16s;
}
.ai-btn:hover{background:#F1EFFF;border-color:#D6D2F8}
.ai-btn:disabled{opacity:.6;cursor:wait}
.ai-btn .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.send-btn{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--ink);color:#fff;transition:.16s;box-shadow:0 4px 10px -6px rgba(15,23,42,.8);
}
.send-btn:hover{background:#1E293B;transform:translateY(-1px)}
.send-btn:disabled{background:#E2E8F0;color:#94A3B8;box-shadow:none;transform:none;cursor:not-allowed}
.c-preview{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;min-height:22px}
.c-hint{font-size:11px;color:var(--faint);margin-left:auto}
.time-capsule{
  display:inline-flex;align-items:center;gap:7px;max-width:100%;
  padding:3px 8px 3px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:11.8px;font-weight:500;color:var(--ink-2);transition:.16s;line-height:1.65;
}
.time-capsule:hover{border-color:var(--indigo-line);background:#FCFCFF}
.time-capsule .tc-emoji{font-size:11px;filter:saturate(.9)}
.time-capsule .tc-tag{font-size:10px;font-weight:600;padding:0 5px;border-radius:999px;background:var(--indigo-soft);color:var(--indigo);line-height:1.6}
.time-capsule.tone-coral{border-color:var(--coral-line);background:var(--coral-soft)}
.time-capsule.tone-coral .tc-tag{background:#FCE3E1;color:#B93F3B}
.time-capsule.tone-amber{border-color:var(--amber-line);background:var(--amber-soft)}
.time-capsule.tone-amber .tc-tag{background:#F7E9CB;color:var(--amber)}
.time-capsule.tone-slate{border-color:var(--line);background:var(--slate-soft)}
.time-capsule.tone-slate .tc-tag{background:#E6EBF1;color:var(--slate)}
.tc-clear{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#E8EDF3;color:var(--muted);margin-left:2px}
.tc-clear:hover{background:#DCE4EE;color:var(--ink)}
.tc-override{font-size:10px;color:var(--indigo);font-weight:600;letter-spacing:.02em}

/* ============================================================
   5. 移动端分段器
   ============================================================ */
.seg{
  display:flex;gap:3px;margin:10px 12px 0;padding:4px;border-radius:12px;
  background:#EDF1F6;border:1px solid #E6ECF3;position:sticky;top:52px;z-index:30;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.seg-btn{flex:1;height:31px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);transition:.18s;min-width:0}
.seg-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-btn .badge{
  min-width:17px;height:16px;padding:0 4px;border-radius:999px;background:#DDE4EC;color:#546279;
  font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);
}
.seg-btn.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.09),0 0 0 .5px rgba(15,23,42,.04)}
.seg-btn.on .badge{background:var(--indigo-soft);color:var(--indigo)}

/* ============================================================
   6. 主体三栏
   ============================================================ */
.board{
  width:100%;max-width:1460px;margin:0 auto;padding:14px 22px 72px;
  display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);
  gap:26px;align-items:start;
}
.col{min-width:0;animation:rise .55s var(--ease) both}
.col:nth-child(1){animation-delay:.06s}
.col:nth-child(2){animation-delay:.11s}
.col:nth-child(3){animation-delay:.16s}
.col-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;padding:0 2px}
.col-title{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.count{
  font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--muted);
  background:#E9EEF4;border-radius:999px;padding:1px 6px;line-height:1.6;min-width:20px;text-align:center;
}
.count.is-zero{opacity:.5}
.col-sub{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.col-head .count{margin-left:2px}

/* 今日计划面板 */
.today-panel{
  border:1px solid var(--indigo-line);border-radius:var(--r-card);
  background:linear-gradient(180deg,#FBFCFF,#F6F7FF);
  box-shadow:0 1px 2px rgba(79,70,229,.05);
  padding:10px 12px;margin-bottom:14px;
}
.tp-top{display:flex;align-items:center;gap:8px}
.tp-badge{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--indigo);background:#fff;border:1px solid var(--indigo-line);border-radius:999px;padding:1px 7px}
.tp-date{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.tp-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tp-count b{font-size:14px;color:var(--ink);font-weight:600}
.tp-bar{height:4px;border-radius:2px;background:#E6E9FB;overflow:hidden;margin:8px 0 6px}
.tp-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#6366F1,#4F46E5);transition:width .35s var(--ease)}
.tp-meta{display:flex;gap:10px;font-size:11px;color:var(--faint);margin-bottom:8px}
.tp-warn{color:var(--coral);font-weight:500}
.tp-ok{color:var(--green)}
.tp-add{display:flex;gap:6px}
.tp-add input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:12px;background:#fff;transition:.15s}
.tp-add input:focus{border-color:var(--indigo-line);box-shadow:0 0 0 3px rgba(79,70,229,.08);outline:none}
.tp-add button{width:30px;height:30px;border-radius:8px;background:var(--indigo);color:#fff;display:grid;place-items:center;flex:0 0 auto;transition:.15s}
.tp-add button:disabled{background:#E2E8F0;color:#94A3B8;cursor:not-allowed}
.tp-add button:not(:disabled):hover{background:var(--indigo-600)}

/* 日期分组 */
.daygroup{margin-bottom:24px}
.day-head{display:flex;align-items:center;gap:10px;padding:0 2px 8px}
.day-tile{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:var(--slate-soft);border:1px solid var(--line);flex:0 0 auto;
}
.day-txt{min-width:0;display:flex;flex-direction:column;line-height:1.28}
.day-title{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.day-sub{font-size:11px;color:var(--faint);font-family:var(--mono);letter-spacing:0}
.day-head .count{margin-left:auto}
.dg-overdue .day-tile{background:var(--coral-soft);border-color:var(--coral-line)}
.dg-overdue .day-title{color:#B93F3B}
.dg-today .day-tile{background:var(--indigo-soft);border-color:var(--indigo-line)}
.dg-today .day-title{color:var(--indigo-600)}
.dg-tomorrow .day-tile{background:var(--amber-soft);border-color:var(--amber-line)}
.dg-future .day-tile{background:#fff;border-color:var(--line)}

/* ============================================================
   7. 任务卡片
   ============================================================ */
.task-list{display:flex;flex-direction:column;gap:8px}
.task{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--sh-1);transition:box-shadow .18s var(--ease),border-color .18s,transform .18s var(--ease);
  overflow:hidden;
}
.task:hover{box-shadow:var(--sh-2);border-color:#D7E0EA;transform:translateY(-1px)}
.task.is-today{border-color:var(--indigo-line);box-shadow:0 0 0 3px rgba(79,70,229,.055),var(--sh-1)}
.task.is-overdue{border-color:var(--coral-line);background:linear-gradient(180deg,#FFFAFA,#fff)}
.task.is-overdue .task-title{color:#9F3A36}
.task.is-done{opacity:.72}
.task.is-open{box-shadow:var(--sh-2);border-color:#D7E0EA;transform:none}
.task-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;padding:10px 9px 10px 12px;align-items:start}
.check{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-strong);margin-top:1px;
  display:grid;place-items:center;color:#fff;transition:.18s var(--ease);flex:0 0 auto;background:#fff;
}
.check:hover{border-color:var(--indigo);background:#F7F8FF;box-shadow:0 0 0 3px rgba(79,70,229,.09)}
.check.on{background:var(--indigo);border-color:var(--indigo);box-shadow:0 2px 6px -2px rgba(79,70,229,.6)}
.check.on:hover{background:var(--indigo-600);border-color:var(--indigo-600)}
.task-body{min-width:0}
.task-title-row{display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap}
.task-title{
  font-size:13.6px;font-weight:500;color:var(--ink);line-height:1.5;cursor:text;
  word-break:break-word;transition:color .15s;letter-spacing:-.006em;
}
.task-title:hover{color:var(--indigo-600)}
.task-title.done{text-decoration:line-through;text-decoration-color:#B6C1CE;color:var(--faint)}
.title-input{
  width:100%;border:0;border-bottom:1.5px solid var(--indigo-line);background:#FBFCFF;
  font-size:13.6px;font-weight:500;padding:0 2px 1px;border-radius:3px 3px 0 0;line-height:1.5;
}
.t-time{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600;
  letter-spacing:-.02em;color:#3B4A5F;background:#F3F6FA;border:1px solid #E7EDF4;
  border-radius:7px;padding:1px 5px;line-height:1.6;min-width:42px;text-align:center;flex:0 0 auto;
  transition:.15s;margin-top:1px;
}
.t-time:hover{background:#EAF0F8;color:var(--indigo-600);border-color:var(--indigo-line)}
.t-time.overdue{color:#B93F3B;background:var(--coral-soft);border-color:var(--coral-line)}
.t-time.done{color:var(--faint);background:#F5F7FA;border-color:var(--line-soft)}
.t-allday{
  font-size:10px;font-weight:600;color:var(--slate);background:var(--slate-soft);
  border:1px solid #E6ECF3;border-radius:6px;padding:1px 5px;line-height:1.7;flex:0 0 auto;margin-top:1px;letter-spacing:.02em;
}
.t-allday:hover{color:var(--indigo-600);border-color:var(--indigo-line);background:#F7F8FF}
.t-fuzzy{
  font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 7px;line-height:1.7;flex:0 0 auto;margin-top:1px;
  border:1px solid var(--amber-line);background:var(--amber-soft);color:var(--amber);
}
.t-fuzzy:hover{border-color:#E8D2A5;background:#FBF0DA}
.t-fuzzy.fz-this_week{color:#9A6B12;background:#FDF6E9;border-color:var(--amber-line)}
.t-fuzzy.fz-next_week{color:#7A6A45;background:#FAF7EF;border-color:#EFE7D3}
.t-fuzzy.fz-this_month{color:#8A6A3A;background:#FAF6EE;border-color:#EDE4D4}
.t-fuzzy.fz-someday{color:#6B7280;background:#F6F7F9;border-color:#E8EBEF}
.t-schedule{
  font-size:10.5px;font-weight:600;color:var(--indigo);background:#F8F9FF;
  border:1px dashed var(--indigo-line);border-radius:6px;padding:1px 6px;line-height:1.7;
  flex:0 0 auto;margin-top:1px;transition:.15s;
}
.t-schedule:hover{background:#EEF1FF;border-style:solid;border-color:var(--indigo)}
.task-meta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap;min-height:15px}
.mini-chip{
  display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);
  padding:0 5px;height:17px;border-radius:5px;background:#F7F9FC;border:1px solid #EDF1F6;line-height:1;
  font-family:var(--mono);font-weight:500;transition:.15s;
}
.mini-chip:hover{background:#EEF2F7;color:var(--ink-2)}
.meta-line{font-size:10.5px;color:var(--faint);font-family:var(--mono);letter-spacing:-.01em}
.meta-warn{font-size:10.5px;color:#B93F3B;font-weight:600}
.task-tools{display:flex;align-items:center;gap:1px;opacity:0;transition:opacity .16s;flex:0 0 auto;margin-top:-1px}
.task:hover .task-tools,.task.is-open .task-tools,.task:focus-within .task-tools{opacity:1}
.tool{
  height:24px;min-width:24px;padding:0 5px;border-radius:6px;display:inline-flex;align-items:center;gap:3px;
  color:var(--faint);font-size:10.5px;transition:.15s;font-family:var(--mono);
}
.tool:hover{background:#F1F5F9;color:var(--ink-2)}
.tool.danger:hover{background:var(--coral-soft);color:var(--coral)}

/* 备注区 */
.task-notes{border-top:1px solid var(--line-soft);padding:10px 12px 12px;background:linear-gradient(180deg,#FCFDFE,#FBFCFE)}
.task-del-row{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line)}
.note-list{display:flex;flex-direction:column;gap:7px}
.note{border-radius:9px;background:#fff;border:1px solid var(--line-soft);padding:7px 9px}
.note-text{font-size:12.5px;line-height:1.62;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.note-input{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;
  line-height:1.6;resize:vertical;min-height:52px;background:#fff;transition:.15s;
}
.note-input:focus{border-color:var(--indigo-line);box-shadow:0 0 0 3px rgba(79,70,229,.07)}
.note-bar{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:10.5px;color:var(--faint)}
.note-bar button{color:var(--muted);font-size:10.5px;padding:1px 4px;border-radius:4px;transition:.15s}
.note-bar button:hover{background:#F1F5F9;color:var(--ink)}
.note-bar button.del:hover{background:var(--coral-soft);color:var(--coral)}
.note-bar .spacer{margin-left:auto}
.note-link{
  display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:9px;background:#fff;
  border:1px solid var(--line-soft);transition:.15s;min-width:0;
}
.note-link:hover{border-color:var(--indigo-line);background:#FBFBFF;box-shadow:var(--sh-1)}
.note-link .lk-ic{color:var(--indigo);flex:0 0 auto;display:flex}
.note-link .lk-txt{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.link-title{font-size:12px;font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-url{font-size:10.5px;color:var(--faint);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.note-img{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line-soft);background:#F1F5F9;cursor:zoom-in}
.note-del{font-size:10.5px;color:#B6C1CE;padding:1px 5px;border-radius:4px;flex:0 0 auto;transition:.15s}
.note-del:hover{background:var(--coral-soft);color:var(--coral)}
.note-img img{width:100%;height:100%;object-fit:cover;transition:transform .28s var(--ease)}
.note-img:hover img{transform:scale(1.045)}
.img-del{
  position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:rgba(15,23,42,.6);
  color:#fff;display:grid;place-items:center;font-size:12px;line-height:1;opacity:0;transition:.15s;backdrop-filter:blur(4px);
}
.note-img:hover .img-del{opacity:1}
.note-add{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.note-tabs{display:flex;gap:2px;margin-bottom:6px}
.ntab{font-size:11px;padding:2px 8px;border-radius:6px;color:var(--muted);transition:.15s}
.ntab:hover{background:#EEF2F7;color:var(--ink-2)}
.ntab.on{background:#fff;color:var(--indigo);box-shadow:0 0 0 1px var(--indigo-line),var(--sh-1);font-weight:500}
.note-add-bar{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.add-link-row{display:flex;gap:6px;margin-bottom:6px}
.add-link-row input{
  flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:12px;background:#fff;
}
.add-link-row input:focus{border-color:var(--indigo-line);box-shadow:0 0 0 3px rgba(79,70,229,.07)}

/* 空状态 */
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:var(--r-card);background:rgba(255,255,255,.6);text-align:center}
.empty-ic{font-size:20px;opacity:.65;margin-bottom:6px}
.empty-title{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.empty-sub{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.6}
.sample-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.chip{
  font-size:11px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:3px 8px;transition:.15s;line-height:1.5;
}
.chip:hover{border-color:var(--indigo-line);color:var(--indigo);background:#FBFBFF}
.mini-empty{font-size:11px;color:#A9B4C2;padding:3px 10px;border-radius:8px;background:transparent;border:1px dashed transparent;letter-spacing:.02em}
.fz-group{margin-bottom:18px}
.fz-head{display:flex;align-items:center;gap:6px;margin-bottom:7px;padding:0 2px}
.fz-head .fz-ic{font-size:11px;opacity:.8}
.fz-head h3{font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.fz-head .count{margin-left:auto;font-size:10px}

/* ============================================================
   8. 已完成抽屉
   ============================================================ */
.done-wrap{max-width:1460px;margin:0 auto;padding:0 22px 60px;width:100%}
.done{
  border:1px solid var(--line);border-radius:var(--r-card);background:rgba(255,255,255,.72);
  box-shadow:var(--sh-1);overflow:hidden;
}
.done-head{display:flex;align-items:center;gap:9px;padding:10px 14px;width:100%;transition:.15s}
.done-head:hover{background:rgba(248,250,252,.9)}
.done-head .chev{transition:transform .22s var(--ease);color:var(--faint);display:flex}
.done-head.open .chev{transform:rotate(90deg)}
.done-title{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.done-count{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:#E9EEF4;border-radius:999px;padding:1px 6px}
.done-head .clear{margin-left:auto;font-size:11px;color:var(--faint);padding:2px 6px;border-radius:5px}
.done-head .clear:hover{background:var(--coral-soft);color:var(--coral)}
.done-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line-soft);padding-top:10px}
.done-item{display:flex;align-items:center;gap:8px;padding:4px 2px;min-width:0}
.done-item .d-title{font-size:12.5px;color:var(--faint);text-decoration:line-through;text-decoration-color:#C9D3DE;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.done-item .d-date{font-family:var(--mono);font-size:10.5px;color:#B6C1CE;margin-left:auto;flex:0 0 auto}
.done-item .restore{font-size:10.5px;color:var(--faint);padding:1px 5px;border-radius:4px;flex:0 0 auto}
.done-item .restore:hover{background:#EEF2F7;color:var(--indigo)}
.restore-check{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto;background:#fff;color:var(--indigo)}
.restore-check:hover{border-color:var(--indigo);background:var(--indigo-soft)}

/* ============================================================
   9. 移动端底部输入舱
   ============================================================ */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  box-shadow:0 -16px 40px -30px rgba(15,23,42,.6);
}
.dock .c-box{border-radius:13px;box-shadow:none;border-color:#E4EAF1;padding:7px 7px 6px 11px;display:flex;align-items:flex-end;gap:4px}
.dock .c-ta{font-size:16px;line-height:1.5;max-height:112px;flex:1 1 auto;min-width:0}
.dock .c-preview{margin-bottom:5px}
.dock .time-capsule{font-size:11px;padding:2px 7px}
.dock .c-actions{gap:4px;margin-top:0;flex:0 0 auto}
.dock .send-btn{width:30px;height:30px}
.dock .ai-btn{height:27px;padding:0 8px}
.dock .icon-btn{width:28px;height:30px}

/* ============================================================
   10. 弹层：设置 / 时间菜单 / 灯箱 / Toast
   ============================================================ */
.mask{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{
  width:100%;max-width:520px;max-height:86dvh;display:flex;flex-direction:column;
  background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:var(--sh-3);overflow:hidden;
}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.modal-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.modal-sub{font-size:11px;color:var(--faint);margin-top:1px}
.modal-close{margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.modal-close:hover{background:#F1F5F9;color:var(--ink)}
.modal-body{padding:14px 16px 18px;overflow-y:auto;overscroll-behavior:contain}
.sect{margin-bottom:20px}
.sect:last-child{margin-bottom:4px}
.sect-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sect-h .hint{margin-left:auto;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--faint);font-weight:400}
.field{margin-bottom:9px}
.label{display:block;font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.input{
  width:100%;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:12.5px;
  background:#fff;transition:.15s;
}
.input:focus{border-color:var(--indigo-line);box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.input[type=date],.input[type=time]{font-family:var(--mono);font-size:12px}
.help{font-size:11px;color:var(--faint);line-height:1.6;margin-top:4px}
.help a{color:var(--indigo);border-bottom:1px solid rgba(79,70,229,.25)}
.row{display:flex;gap:8px;align-items:center}
.row > .input{flex:1}
.kbd{font-family:var(--mono);font-size:10px;background:#F1F5F9;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.divider{height:1px;background:var(--line-soft);margin:16px 0}
.status-line{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-top:6px;padding:6px 9px;border-radius:8px;background:#F8FAFC;border:1px solid var(--line-soft)}
.status-line.ok{color:#0B7A5C;background:#F2FBF8;border-color:#D6EFE6}
.status-line.err{color:#B93F3B;background:var(--coral-soft);border-color:var(--coral-line)}
.status-line .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;flex:0 0 auto}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:56px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--muted);padding:2px 5px;border-radius:5px}
.pw-toggle:hover{background:#F1F5F9;color:var(--ink)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line-soft);background:#FCFDFE}

.pop-mask{position:fixed;inset:0;z-index:60}
.pop{position:fixed;z-index:61;width:268px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-3);padding:6px;animation:pop .16s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.tm-head{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:5px 7px 6px}
.tm-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 7px;border-radius:7px;font-size:12.5px;color:var(--ink-2);transition:.12s}
.tm-item:hover{background:#F5F7FA;color:var(--ink)}
.tm-item .tm-k{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.tm-item .tm-e{font-size:12px;width:16px;text-align:center}
.tm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:2px 5px 6px}
.tm-chip{font-size:11.5px;padding:5px 2px;border-radius:7px;border:1px solid var(--line-soft);background:#FCFDFE;color:var(--ink-2);transition:.14s;white-space:nowrap}
.tm-chip:hover{border-color:var(--indigo-line);background:#F7F8FF;color:var(--indigo)}
.tm-sep{height:1px;background:var(--line-soft);margin:5px 4px}
.tm-custom{padding:6px 7px 4px;border-top:1px solid var(--line-soft);margin-top:4px}
.tm-custom .row{margin-bottom:6px}
.tm-custom .input{height:30px;font-size:12px}
.tm-actions{display:flex;gap:6px;justify-content:flex-end}

.lb{position:fixed;inset:0;z-index:90;background:rgba(8,12,20,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lb-img{max-width:min(100%,1100px);max-height:78dvh;border-radius:8px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);object-fit:contain}
.lb-bar{display:flex;gap:10px;margin-top:16px}
.lb-btn{height:32px;padding:0 14px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;border:1px solid rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:6px;transition:.15s;backdrop-filter:blur(8px)}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-btn.danger{color:#FFB4AE;border-color:rgba(255,120,110,.35)}
.lb-btn.danger:hover{background:rgba(220,60,50,.28)}
.lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}

.toast-wrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 28px)}
.toast{
  display:flex;align-items:center;gap:12px;padding:8px 8px 8px 13px;border-radius:11px;
  background:rgba(15,23,42,.94);color:#fff;font-size:12.5px;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);
  backdrop-filter:blur(10px);pointer-events:auto;animation:toastIn .26s var(--ease) both;
}
.toast.is-err{background:rgba(160,45,40,.96)}
.toast-act{font-size:11.5px;font-weight:600;color:#C7C3FF;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.1)}
.toast-act:hover{background:rgba(255,255,255,.18)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* ============================================================
   11. 动画
   ============================================================ */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.list-enter-from{opacity:0;transform:translateY(-6px) scale(.985)}
.list-enter-active{transition:all .26s var(--ease)}
.list-leave-to{opacity:0;transform:translateX(10px) scale(.985)}
.list-leave-active{transition:all .2s var(--ease);position:relative}
.list-move{transition:transform .3s var(--ease)}
.fade-enter-from,.fade-leave-to{opacity:0}
.fade-enter-active,.fade-leave-active{transition:opacity .18s ease}
.zoom-enter-from,.zoom-leave-to{opacity:0;transform:scale(.97)}
.zoom-enter-active,.zoom-leave-active{transition:all .2s var(--ease)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ============================================================
   12. 响应式
   ============================================================ */
@media (max-width:1023px){
  .desktop-only{display:none!important}
  .topbar-in{padding:7px 12px;gap:8px;flex-wrap:nowrap}
  .brand-name{font-size:18px}
  .brand .logo{width:26px;height:26px;border-radius:8px}
  .search{max-width:none}
  .search input{height:32px;font-size:13px}
  .sync-chip{width:30px;height:30px;padding:0;justify-content:center;border-color:var(--line);background:#fff}
  .sync-chip .sync-text{display:none}
  .seg{top:47px;margin:8px 10px 0}
  .board{display:block;padding:12px 10px calc(140px + env(safe-area-inset-bottom,0px))}
  .col{display:none;animation:none}
  .col.active{display:block}
  /* 搜索时解除单栏限制：三个分区一起出结果，避免"跨 Tab 搜不到" */
  .board.is-searching .col{display:block}
  .col-head{margin:4px 2px 10px}
  .col-title{font-size:11.5px}
  .done-wrap{padding:0 10px calc(150px + env(safe-area-inset-bottom,0px))}
  .task-in{padding:11px 8px 11px 11px}
  .task-title{font-size:14.5px}
  .t-time{font-size:12px;min-width:44px}
  .task-tools{opacity:1}
  .tool{padding:0 4px}
  .tool.danger{display:none}
  .task{padding-right:2px}
  .note-imgs{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .img-del{opacity:1}
  .banner-wrap{padding:0 10px;margin-top:10px}
  .banner-text{font-size:12.2px}
  .modal{max-height:90dvh;border-radius:16px}
  .mask{padding:10px;align-items:flex-end}
  .mask.center{align-items:center}
  .modal-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:1024px){
  .mobile-only{display:none!important}
}
</style>
</head>
<body>

<div id="app" v-cloak></div>
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif">ChronoNote 需要启用 JavaScript 才能运行。</div></noscript>

<!-- ============================================================
     模板：主应用
     ============================================================ -->
<script type="text/x-template" id="tpl-app">
<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <span class="logo"><icon name="clock" :size="15" :stroke="2.3"/></span>
        <span class="brand-name">Chrono<em>Note</em></span>
      </div>

      <div class="search">
        <span class="search-ic"><icon name="search" :size="14"/></span>
        <input v-model="S.search" type="search" inputmode="search" placeholder="搜索事项或备注…" aria-label="搜索事项与备注">
        <button v-if="S.search" class="search-clear" @click="S.search=''" aria-label="清空搜索"><icon name="x" :size="11" :stroke="2.4"/></button>
      </div>

      <button class="sync-chip" :class="'is-'+syncState" @click="A.syncClick" :title="S.sync.message || '同步状态'">
        <span class="dot"></span><span class="sync-text">{{ syncText }}</span>
      </button>

      <button class="icon-btn" @click="A.openSettings" title="设置" aria-label="设置">
        <icon name="settings" :size="16"/>
      </button>
    </div>
  </header>

  <!-- 跨周提醒 -->
  <transition name="fade">
    <div class="banner-wrap" v-if="S.banner.show">
      <div class="banner">
        <span class="b-ic"><icon name="alert" :size="15"/></span>
        <div class="banner-text">
          新的一周开始了，是否将原定【下周】的 <b>{{ S.banner.count }}</b> 个事项自动移入【本周】？
        </div>
        <div class="banner-actions">
          <button class="btn btn-sm btn-amber" @click="A.promoteNextWeek">一键移入</button>
          <button class="btn btn-sm" @click="A.dismissBanner">忽略</button>
        </div>
      </div>
    </div>
  </transition>

  <!-- 桌面端快捷输入 -->
  <div class="composer-wrap desktop-only">
    <composer-box variant="desktop"/>
  </div>

  <!-- 移动端分段控制 -->
  <div class="seg mobile-only" role="tablist">
    <button class="seg-btn" :class="{on:S.tab==='timeline'}" @click="S.tab='timeline'" role="tab">
      <span>📅</span><span class="lbl">时间轴</span>
      <span class="badge" v-if="G.counts.timeline">{{ G.counts.timeline }}</span>
    </button>
    <button class="seg-btn" :class="{on:S.tab==='plan'}" @click="S.tab='plan'" role="tab">
      <span>🧭</span><span class="lbl">大致规划</span>
      <span class="badge" v-if="G.counts.fuzzy">{{ G.counts.fuzzy }}</span>
    </button>
    <button class="seg-btn" :class="{on:S.tab==='inbox'}" @click="S.tab='inbox'" role="tab">
      <span>📥</span><span class="lbl">琐事箱</span>
      <span class="badge" v-if="G.counts.inbox">{{ G.counts.inbox }}</span>
    </button>
  </div>

  <!-- 三栏主体 -->
  <main class="board" :class="{'is-searching': !!S.search.trim()}">
    <!-- 主时间轴 -->
    <section class="col" :class="{active:S.tab==='timeline'}">
      <div class="col-head">
        <span class="col-title">时间轴</span>
        <span class="count" :class="{'is-zero':!G.counts.timeline}">{{ G.counts.timeline }}</span>
        <span class="col-sub" v-if="G.timeline.length">{{ G.todayLabel }}</span>
      </div>

      <div class="today-panel" v-if="!S.search">
        <div class="tp-top">
          <span class="tp-badge">今日计划</span>
          <span class="tp-date">{{ G.todayLabel }}</span>
          <span class="tp-count"><b>{{ G.todayStats.done }}</b>/{{ G.todayStats.total }}</span>
        </div>
        <div class="tp-bar"><i :style="{width:G.todayPct+'%'}"></i></div>
        <div class="tp-meta">
          <span>待办 {{ G.todayStats.open }} 项</span>
          <span v-if="G.todayStats.overdue" class="tp-warn">逾期 {{ G.todayStats.overdue }} 项</span>
          <span v-else class="tp-ok">无逾期</span>
        </div>
        <div class="tp-add">
          <input v-model="S.todayDraft" @keydown.enter="A.addToday" placeholder="加到今天，回车即可…" aria-label="添加到今天">
          <button @click="A.addToday" :disabled="!S.todayDraft.trim()" aria-label="添加">
            <icon name="plus" :size="12" :stroke="2.6"/>
          </button>
        </div>
      </div>

      <div v-if="!G.timeline.length" class="empty">
        <div class="empty-ic">🗓️</div>
        <div class="empty-title">{{ S.search ? '没有匹配的时间轴事项' : '时间轴还很空' }}</div>
        <div class="empty-sub" v-if="!S.search">试试这样记：<br>“明天下午3点 交周报 // 记得附上链接”</div>
        <div class="sample-chips" v-if="!S.search">
          <button class="chip" @click="A.fillDraft('明天下午3点 交周报')">明天下午3点 交周报</button>
          <button class="chip" @click="A.fillDraft('11月8日 体检')">11月8日 体检</button>
        </div>
      </div>

      <div v-for="g in G.timeline" :key="g.key" class="daygroup" :class="'dg-'+g.kind">
        <div class="day-head">
          <span class="day-tile">{{ g.icon }}</span>
          <span class="day-txt">
            <span class="day-title">{{ g.title }}</span>
            <span class="day-sub">{{ g.sub }}</span>
          </span>
          <span class="count">{{ g.items.length }}</span>
        </div>
        <transition-group name="list" tag="div" class="task-list">
          <task-card v-for="t in g.items" :key="t.id" :task="t"/>
        </transition-group>
      </div>
    </section>

    <!-- 近期规划 -->
    <section class="col" :class="{active:S.tab==='plan'}">
      <div class="col-head">
        <span class="col-title">近期规划</span>
        <span class="count" :class="{'is-zero':!G.counts.fuzzy}">{{ G.counts.fuzzy }}</span>
      </div>

      <div v-if="!G.counts.fuzzy" class="empty">
        <div class="empty-ic">🧭</div>
        <div class="empty-title">{{ S.search ? '没有匹配的规划' : '近期还没有规划' }}</div>
        <div class="empty-sub" v-if="!S.search">“下周 洗车”、“本月 整理照片”</div>
      </div>

      <template v-for="k in G.fuzzyKeys" :key="k">
      <div class="fz-group" v-if="G.fuzzy[k].length">
        <div class="fz-head">
          <span class="fz-ic">{{ fuzzyMetaOf(k).icon }}</span>
          <h3>{{ fuzzyMetaOf(k).label }}</h3>
          <span class="count" :class="{'is-zero':!G.fuzzy[k].length}">{{ G.fuzzy[k].length }}</span>
        </div>
        <transition-group name="list" tag="div" class="task-list" v-if="G.fuzzy[k].length">
          <task-card v-for="t in G.fuzzy[k]" :key="t.id" :task="t"/>
        </transition-group>
        <div v-else-if="!S.search" class="mini-empty">暂无</div>
      </div>
      </template>
    </section>

    <!-- 琐事箱 -->
    <section class="col" :class="{active:S.tab==='inbox'}">
      <div class="col-head">
        <span class="col-title">琐事收集箱</span>
        <span class="count" :class="{'is-zero':!G.counts.inbox}">{{ G.counts.inbox }}</span>
      </div>

      <div v-if="!G.inbox.length" class="empty">
        <div class="empty-ic">📥</div>
        <div class="empty-title">{{ S.search ? '没有匹配的琐事' : '收集箱空空如也' }}</div>
        <div class="empty-sub" v-if="!S.search">没有时间限制的杂事都会落在这里。</div>
      </div>

      <transition-group name="list" tag="div" class="task-list" v-if="G.inbox.length">
        <task-card v-for="t in G.inbox" :key="t.id" :task="t"/>
      </transition-group>
    </section>
  </main>

  <!-- 已完成抽屉 -->
  <div class="done-wrap" v-if="G.done.length">
    <div class="done">
      <button class="done-head" :class="{open:S.doneOpen}" @click="S.doneOpen=!S.doneOpen">
        <span class="chev"><icon name="chevron-right" :size="14"/></span>
        <span class="done-title">已完成</span>
        <span class="done-count">{{ G.done.length }}</span>
        <span class="clear" @click.stop="A.clearCompleted">清空</span>
      </button>
      <transition name="fade">
        <div class="done-body" v-if="S.doneOpen">
          <div class="done-item" v-for="t in G.done" :key="t.id">
            <button class="restore-check" @click="A.toggleTask(t)" title="恢复"><icon name="check" :size="9" :stroke="3"/></button>
            <span class="d-title">{{ t.title }}</span>
            <span class="d-date">{{ A.shortDone(t) }}</span>
            <button class="restore" @click="A.restoreTask(t)">恢复</button>
            <button class="restore" @click="A.removeTask(t, true)">删除</button>
          </div>
        </div>
      </transition>
    </div>
  </div>

  <!-- 移动端底部输入舱 -->
  <div class="dock mobile-only">
    <composer-box variant="dock"/>
  </div>

  <!-- 时间菜单 -->
  <div v-if="S.picker.open" class="pop-mask" @click="A.closePicker"></div>
  <div v-if="S.picker.open" class="pop" :style="{left:S.picker.x+'px',top:S.picker.y+'px'}">
    <time-menu @pick="A.onPick"/>
  </div>

  <!-- 设置 -->
  <transition name="fade">
    <div class="mask center" v-if="S.settingsOpen" @click.self="A.closeSettings">
      <div class="modal" role="dialog" aria-modal="true" aria-label="设置">
        <div class="modal-head">
          <div>
            <div class="modal-title">设置</div>
            <div class="modal-sub">数据只保存在本机，同步仅在你手动触发时发生</div>
          </div>
          <button class="modal-close" @click="A.closeSettings" aria-label="关闭"><icon name="x" :size="14"/></button>
        </div>

        <div class="modal-body">
          <div class="sect">
            <div class="sect-h"><icon name="sparkles" :size="12"/> AI 引擎
              <span class="hint">DeepSeek</span>
            </div>
            <div class="field">
              <label class="label">API Key</label>
              <div class="pw-wrap">
                <input class="input" :type="S.showKey?'text':'password'" v-model.trim="S.settings.deepseekApiKey"
                       placeholder="sk-…" autocomplete="off" spellcheck="false">
                <button class="pw-toggle" @click="S.showKey=!S.showKey">{{ S.showKey ? '隐藏' : '显示' }}</button>
              </div>
              <div class="help">在 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">platform.deepseek.com</a> 创建，仅明文保存在本机 localStorage。</div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="sect">
            <div class="sect-h"><icon name="cloud" :size="12"/> 跨端同步
              <span class="hint">GitHub Gist</span>
            </div>
            <div class="field">
              <label class="label">Personal Access Token</label>
              <div class="pw-wrap">
                <input class="input" :type="S.showToken?'text':'password'" v-model.trim="S.settings.githubToken"
                       placeholder="ghp_…（需 gist 权限）" autocomplete="off" spellcheck="false">
                <button class="pw-toggle" @click="S.showToken=!S.showToken">{{ S.showToken ? '隐藏' : '显示' }}</button>
              </div>
            </div>
            <div class="field">
              <label class="label">Gist ID</label>
              <input class="input" v-model.trim="S.settings.gistId" placeholder="留空则首次同步时自动创建私密 Gist">
            </div>
            <div class="row">
              <button class="btn btn-accent" @click="A.doSync()" :disabled="S.syncing">
                <icon name="refresh" :size="13" :class="{'spin':S.syncing}"/> {{ S.syncing ? '同步中…' : '立即同步' }}
              </button>
              <button class="btn" @click="A.testGithub" :disabled="!S.settings.githubToken || S.testingGh">
                {{ S.testingGh ? '检测中…' : '检测 Token' }}
              </button>
            </div>
            <div class="status-line" :class="S.ghStatus.tone" v-if="S.ghStatus.text">
              <span class="dot"></span>{{ S.ghStatus.text }}
            </div>
            <div class="help">合并规则：按 id 比对，updatedAt 更新的一方胜出；删除会写成 deleted=true 再同步，避免在另一台设备上“复活”。</div>
          </div>

          <div class="divider"></div>

          <div class="sect">
            <div class="sect-h"><icon name="download" :size="12"/> 数据</div>
            <div class="row" style="flex-wrap:wrap">
              <button class="btn" @click="A.exportJson"><icon name="download" :size="13"/> 导出 JSON</button>
              <button class="btn" @click="A.triggerImport"><icon name="upload" :size="13"/> 导入并合并</button>
              <button class="btn btn-danger" @click="A.wipeAll">清空全部</button>
            </div>
            <input ref="importEl" type="file" accept="application/json,.json" hidden @change="A.importJson">
            <div class="help">共 {{ S.tasks.length }} 条记录（含已删除软标记 {{ G.deletedCount }} 条），存储在 IndexedDB。</div>
          </div>

          <div class="divider"></div>

          <div class="sect">
            <div class="sect-h"><icon name="clock" :size="12"/> 关于</div>
            <div class="help" style="margin-top:0">
              ChronoNote v1.2 · 单文件离线优先应用 · 本周 <span class="kbd">{{ G.isoWeek }}</span><br>
              快捷语法：<span class="kbd"> // </span> 之后的文字会成为子备注；输入框内 <span class="kbd">Ctrl</span>+<span class="kbd">V</span> 可直接粘贴图片。
            </div>
          </div>
        </div>

        <div class="modal-foot">
          <button class="btn" @click="A.closeSettings">完成</button>
        </div>
      </div>
    </div>
  </transition>

  <!-- 确认框 -->
  <transition name="fade">
    <div class="mask center" v-if="S.confirm.open" @click.self="A.closeConfirm">
      <div class="modal" style="max-width:380px" role="alertdialog" aria-modal="true">
        <div class="modal-head">
          <div class="modal-title">{{ S.confirm.title }}</div>
        </div>
        <div class="modal-body" style="padding-bottom:8px">
          <div class="help" style="font-size:12.5px;color:#475569;margin-top:0">{{ S.confirm.body }}</div>
        </div>
        <div class="modal-foot">
          <button class="btn" @click="A.closeConfirm">取消</button>
          <button class="btn" :class="S.confirm.danger?'btn-danger':'btn-primary'" @click="A.confirmOk">{{ S.confirm.okText }}</button>
        </div>
      </div>
    </div>
  </transition>

  <!-- 灯箱 -->
  <transition name="fade">
    <div class="lb" v-if="S.lightbox" @click.self="A.closeLightbox">
      <button class="lb-close" @click="A.closeLightbox" aria-label="关闭"><icon name="x" :size="16"/></button>
      <img class="lb-img" :src="S.lightbox.src" alt="图片预览">
      <div class="lb-bar">
        <button class="lb-btn" @click="A.downloadLightbox"><icon name="download" :size="13"/> 保存原图</button>
        <button class="lb-btn danger" @click="A.deleteLightbox"><icon name="trash" :size="13"/> 删除</button>
      </div>
    </div>
  </transition>

  <!-- Toast -->
  <div class="toast-wrap" v-if="S.toast.show">
    <div class="toast" :class="{'is-err':S.toast.err}">
      <span>{{ S.toast.text }}</span>
      <button v-if="S.toast.actLabel" class="toast-act" @click="A.runToastAction">{{ S.toast.actLabel }}</button>
    </div>
  </div>

</div>
</script>

<!-- ============================================================
     模板：任务卡片
     ============================================================ -->
<script type="text/x-template" id="tpl-card">
<div class="task" :class="cardClass" @click="onCardClick">
  <div class="task-in">
    <button class="check" :class="{on:task.completed}" @click="A.toggleTask(task)"
            :title="task.completed ? '标记为未完成' : '标记为已完成'" :aria-pressed="task.completed">
      <icon v-if="task.completed" name="check" :size="11" :stroke="3.2"/>
    </button>

    <div class="task-body">
      <div class="task-title-row">
        <button v-if="showClock" class="t-time" :class="{overdue:isOverdue, done:task.completed}"
                @click="A.openPicker(task, $event)" :title="clockTitle">{{ task.targetTime }}</button>
        <button v-else-if="showAllday" class="t-allday" @click="A.openPicker(task, $event)" title="全天事项">全天</button>
        <button v-else-if="showFuzzy" class="t-fuzzy" :class="'fz-'+task.fuzzyTag"
                @click="A.openPicker(task, $event)">{{ fuzzyText }}</button>
        <button v-else class="t-schedule" @click="A.openPicker(task, $event)" title="点击安排时间">+ 排期</button>

        <input v-if="editing" ref="titleInput" class="title-input" v-model="titleDraft"
               @keydown.enter.prevent="commitTitle" @keydown.esc.stop="cancelTitle" @blur="commitTitle">
        <h3 v-else class="task-title" :class="{done:task.completed}" @click="startEdit">{{ task.title }}</h3>
      </div>

      <div class="task-meta" v-if="hasMeta">
        <button class="mini-chip" v-if="counts.text" @click="A.toggleExpand(task)" :title="counts.text+' 条文字备注'">📝 {{ counts.text }}</button>
        <button class="mini-chip" v-if="counts.link" @click="A.toggleExpand(task)" :title="counts.link+' 条链接备注'">🔗 {{ counts.link }}</button>
        <button class="mini-chip" v-if="counts.image" @click="A.toggleExpand(task)" :title="counts.image+' 张图片'">🖼️ {{ counts.image }}</button>
        <span class="meta-warn" v-if="isOverdue">已过期</span>
        <span class="meta-line" v-if="metaText">{{ metaText }}</span>
      </div>
    </div>

    <div class="task-tools">
      <button class="tool" @click="A.toggleExpand(task)" :title="expanded ? '收起备注' : '打开备注'">
        <icon :name="expanded ? 'chevron-down' : 'chevron-right'" :size="13"/>
      </button>
      <button class="tool danger" @click="A.removeTask(task)" title="删除"><icon name="trash" :size="12.5"/></button>
    </div>
  </div>

  <transition name="fade">
    <div class="task-notes" v-if="expanded">
      <div class="note-list">
        <template v-for="n in task.notes" :key="n.id">
          <div class="note" v-if="n.type!=='image'">
            <template v-if="n.type==='text'">
              <textarea v-if="editId===n.id" class="note-input" v-model="editText" rows="3"
                        @keydown.esc.stop="cancelNote" @keydown.ctrl.enter.prevent="saveNote(n)" @keydown.meta.enter.prevent="saveNote(n)"></textarea>
              <p v-else class="note-text">{{ n.content }}</p>
              <div class="note-bar">
                <span>文字</span>
                <button v-if="editId!==n.id" @click="startNote(n)">编辑</button>
                <button v-else @click="saveNote(n)">保存</button>
                <button v-if="editId===n.id" @click="cancelNote">取消</button>
                <span class="spacer"></span>
                <button class="del" @click="A.deleteNote(task,n)">删除</button>
              </div>
            </template>

            <a v-else class="note-link" :href="n.content" target="_blank" rel="noopener noreferrer">
              <span class="lk-ic"><icon name="link" :size="13"/></span>
              <span class="lk-txt">
                <span class="link-title">{{ n.title || A.hostOf(n.content) }}</span>
                <span class="link-url">{{ n.content }}</span>
              </span>
              <span class="spacer" style="margin-left:auto"></span>
              <button class="note-del" @click.prevent="A.deleteNote(task,n)">删除</button>
            </a>
          </div>
        </template>

        <div class="note-imgs" v-if="imageNotes.length">
          <div class="note-img" v-for="n in imageNotes" :key="n.id">
            <img :src="n.content" alt="图片备注" loading="lazy" @click="A.openLightbox(n)">
            <button class="img-del" @click.stop="A.deleteNote(task,n)" aria-label="删除图片">×</button>
          </div>
        </div>
      </div>

      <div class="note-add">
        <div class="note-tabs">
          <button class="ntab" :class="{on:mode==='text'}" @click="mode='text'">文字</button>
          <button class="ntab" :class="{on:mode==='link'}" @click="mode='link'">链接</button>
          <button class="ntab" :class="{on:mode==='image'}" @click="mode='image'">图片</button>
        </div>

        <template v-if="mode==='text'">
          <textarea class="note-input" v-model="newText" rows="2"
                    placeholder="写点备注…（Ctrl+V 可直接粘贴图片）"

      /* ---------- DeepSeek 引擎 B ---------- */
      function buildSystemPrompt() {

          '你是 ChronoNote 的时间解析与任务拆解引擎，负责把用户的一句话拆成若干条独立事项。',
          '当前时间：' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +

          '',

          '- targetTime: "HH:mm" 24小时制 或 null（仅 exact_time 必填）',

          '- notes: 数组，元素为 {"type":"text"|"link","content":"...","title":"可选，域名或说明"}',
          '',
          '规则：',
          '1. " // "（空格+双斜杠+空格）之后的内容是该事项的备注；其中 URL 生成 type=link 备注（title 用域名），其余文字生成 type=text 备注。',
          '2. 相对时间必须相对上面的“今天”换算；"下午3点半"→"15:30"，"晚上8点"→"20:00"。',
          '3. 多件事必须拆成多个任务，每件事一条，不要合并。',
          '4. 没有时间信息的用 nodate；只有模糊时间时用 fuzzy，档位对应：这三天内→three_days，本周/这周→this_week，下周→next_week，两周内/半个月内→two_weeks，本月/月底→this_month，下个月→next_month，今年内/年底前→this_year，没空具体说→someday。',
          '5. 不要输出 id、createdAt、updatedAt、completed、deleted，这些由前端补齐。',
          '6. 不要编造用户没说过的事情，notes 里不要放 title 之外的时间词。'

      function stripFence(s) {

      function callDeepSeek(userText) {
        var key = String(S.settings.deepseekApiKey || '').trim();

          max_tokens: 2048,
