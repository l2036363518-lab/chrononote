          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify(payload),
          signal: ctrl ? ctrl.signal : undefined
        }).then(function (res) {
          if (!res.ok) {
            return res.text().then(function (txt) {
              var msg = 'HTTP ' + res.status;
              try {
                var j = JSON.parse(txt);
                if (j && j.error && j.error.message) msg += '：' + j.error.message;
              } catch (e) {
                if (txt) msg += '：' + txt.slice(0, 120);
              }
              throw new Error(msg);
            });
          }
          return res.json();
        }).then(function (data) {
          var content = data && data.choices && data.choices[0] && data.choices[0].message
            ? data.choices[0].message.content : '';
          if (!content) throw new Error('AI 返回内容为空');
          var parsed = null;
          try { parsed = JSON.parse(content); }
          catch (e) { parsed = JSON.parse(stripFence(content)); }
          var arr = Array.isArray(parsed) ? parsed : (parsed && parsed.tasks);
          if (!Array.isArray(arr)) throw new Error('AI 返回的 JSON 不含 tasks 数组');
          return arr;
        }).then(function (v) {
          clearTimeout(timer);
          return v;
        }, function (e) {
          clearTimeout(timer);
          if (e && e.name === 'AbortError') throw new Error('请求超时（60 秒）');
          throw e;
        });
      }

      function runAI() {
        if (S.aiLoading) return;
        var text = String(S.draft || '').trim();
        if (!text) { toast('先写点什么，再让 AI 拆解', true); return; }
        if (!String(S.settings.deepseekApiKey || '').trim()) {
          S.settingsOpen = true;
          toast('请先在设置里填写 DeepSeek API Key', true);
          return;
        }
        S.aiLoading = true;
        callDeepSeek(text).then(function (raw) {
          var now = Date.now();
          var list = raw.map(function (r) {
            if (!r || typeof r !== 'object') return null;
            return normalizeTask({
              title: r.title,
              timeType: r.timeType,
              targetDate: r.targetDate,
              targetTime: r.targetTime,
              fuzzyTag: r.fuzzyTag,
              notes: Array.isArray(r.notes) ? r.notes : [],
              completed: false,
              deleted: false,
              createdAt: now,
              updatedAt: now
            });
          }).filter(Boolean);

          if (!list.length) throw new Error('没有识别出任何事项');
          if (S.draftImages.length) {
            var imgs = S.draftImages.slice();
            imgs.forEach(function (src) { list[0].notes.push(makeImageNote(src)); });
          }
          list.forEach(function (t) { S.tasks.push(t); });
          S.draft = '';
          S.draftImages = [];
          S.draftOverride = null;
          toast('AI 已拆解 ' + list.length + ' 个事项');
          if (list.length === 1) S.tab = list[0].targetDate || list[0].fuzzyTag ? 'timeline' : 'inbox';
        }).catch(function (err) {
          console.error('[ChronoNote] AI 失败', err);
          var msg = err && err.message ? err.message : '未知错误';
          if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
            msg = '网络请求失败：可能是离线、被浏览器拦截，或 DeepSeek 未允许跨域调用';
          }
          toast('AI 解析失败：' + msg, true);
        }).then(function () {
          S.aiLoading = false;
        });
      }

      /* ---------- 派生数据 ---------- */
      var activeTasks = computed(function () {
        var q = String(S.search || '').trim().toLowerCase();
        return S.tasks.filter(function (t) {
          if (t.deleted || t.completed) return false;
          if (!q) return true;
          if (String(t.title).toLowerCase().indexOf(q) >= 0) return true;
          for (var i = 0; i < t.notes.length; i++) {
            var n = t.notes[i];
            var hay = (n.content || '') + ' ' + (n.title || '');
            if (hay.toLowerCase().indexOf(q) >= 0) return true;
          }
          return false;
        });
      });

      var doneTasks = computed(function () {
        var q = String(S.search || '').trim().toLowerCase();
        return S.tasks.filter(function (t) {
          if (t.deleted || !t.completed) return false;
          if (!q) return true;
          return String(t.title).toLowerCase().indexOf(q) >= 0;
        }).sort(function (a, b) { return b.updatedAt - a.updatedAt; });
      });

      var timelineG = computed(function () {
        var today = S.today;
        var items = activeTasks.value.filter(function (t) {
          return t.timeType === 'exact_time' || t.timeType === 'exact_date';
        });
        var map = new Map();
        items.forEach(function (t) {
          var d = t.targetDate || today;
          if (!map.has(d)) map.set(d, []);
          map.get(d).push(t);
        });
        function sortDay(arr) {
          return arr.slice().sort(function (a, b) {
            var at = a.timeType === 'exact_time' ? (a.targetTime || '00:00') : '99:99';
            var bt = b.timeType === 'exact_time' ? (b.targetTime || '00:00') : '99:99';
            if (at !== bt) return at < bt ? -1 : 1;
            return a.createdAt - b.createdAt;
          });
        }
        var dates = Array.from(map.keys()).sort();
        var out = [];
        var overdueDates = dates.filter(function (d) { return d < today; });
        if (overdueDates.length) {
          var od = [];
          overdueDates.sort().reverse().forEach(function (d) { od = od.concat(sortDay(map.get(d))); });
          out.push({
            key: 'overdue', kind: 'overdue', icon: '⚠️', title: '已过期',
            sub: '最早 ' + fmtMD(overdueDates[0]) + ' · 共 ' + od.length + ' 项',
            items: od
          });
        }
        var todayItems = map.get(today) || [];
        if (todayItems.length) {
          out.push({
            key: 'today', kind: 'today', icon: '🎯', title: '今天',
            sub: fmtMDWeek(today) + ' · ' + todayItems.length + ' 项',
            items: sortDay(todayItems)
          });
        }
        var tomorrow = ymd(addDays(parseISO(today) || new Date(), 1));
        var tomorrowItems = map.get(tomorrow) || [];
        if (tomorrowItems.length) {
          out.push({
            key: 'tomorrow', kind: 'tomorrow', icon: '☀️', title: '明天',
            sub: fmtMDWeek(tomorrow), items: sortDay(tomorrowItems)
          });
        }
        dates.forEach(function (d) {
          if (d <= tomorrow) return;
          var diff = dayDiff(d, today);
          out.push({
            key: 'd-' + d, kind: 'future', icon: '📅', title: fmtMDWeek(d),
            sub: '还有 ' + diff + ' 天', items: sortDay(map.get(d))
          });
        });
        return out;
      });

      var fuzzyKeysG = computed(function () {
        var keys = FUZZY_ORDER.slice();
        S.tasks.forEach(function (t) {
          if (t.deleted || t.completed) return;
          if (t.timeType === 'fuzzy' && t.fuzzyTag && keys.indexOf(t.fuzzyTag) < 0) keys.push(t.fuzzyTag);
        });
        return keys;
      });

      var fuzzyG = computed(function () {
        var g = {};
        fuzzyKeysG.value.forEach(function (k) { g[k] = []; });
        activeTasks.value.forEach(function (t) {
          if (t.timeType !== 'fuzzy' || !t.fuzzyTag) return;
          if (!g[t.fuzzyTag]) g[t.fuzzyTag] = [];
          g[t.fuzzyTag].push(t);
        });
        Object.keys(g).forEach(function (k) {
          g[k].sort(function (a, b) { return b.createdAt - a.createdAt; });
        });
        return g;
      });

      var inboxG = computed(function () {
        return activeTasks.value
          .filter(function (t) { return t.timeType === 'nodate'; })
          .sort(function (a, b) { return b.createdAt - a.createdAt; });
      });

      var countsG = computed(function () {
        var timeline = 0;
        timelineG.value.forEach(function (g) { timeline += g.items.length; });
        var fuzzy = 0;
        Object.keys(fuzzyG.value).forEach(function (k) { fuzzy += fuzzyG.value[k].length; });
        return { timeline: timeline, fuzzy: fuzzy, inbox: inboxG.value.length };
      });

      var todayStatsG = computed(function () {
        var total = 0, done = 0, open = 0, overdue = 0;
        S.tasks.forEach(function (t) {
          if (t.deleted) return;
          var isToday = (t.timeType === 'exact_time' || t.timeType === 'exact_date') && t.targetDate === S.today;
          if (isToday) {
            total++;
            if (t.completed) done++; else open++;
          }
          if (!t.completed && t.targetDate && t.targetDate < S.today) overdue++;
        });
        return { total: total, done: done, open: open, overdue: overdue };
      });

      var todayPctG = computed(function () {
        var s = todayStatsG.value;
        return s.total ? Math.round(s.done / s.total * 100) : 0;
      });

      Object.assign(G, {
        timeline: timelineG,
        fuzzy: fuzzyG,
        fuzzyKeys: fuzzyKeysG,
        inbox: inboxG,
        done: doneTasks,
        counts: countsG,
        todayStats: todayStatsG,
        todayPct: todayPctG,
        deletedCount: computed(function () {
          return S.tasks.filter(function (t) { return t.deleted; }).length;
        }),
        pending: computed(function () {
          return S.tasks.filter(function (t) { return !t.deleted && !t.completed; }).length;
        }),
        todayLabel: computed(function () {
          return fmtMDWeek(S.today);
        }),
        isoWeek: computed(function () { return S.isoWeek; })
      });

      /* ---------- 元信息 ---------- */
      function metaHint(t) {
        if (t.timeType === 'nodate') return '创建于 ' + fromNow(t.createdAt);
        /* 过期分组把多个历史日期并在一起，必须标出原定日期才看得懂 */
        if (t.targetDate && (t.targetDate < S.today || String(S.search || '').trim())) {
          return fmtMDWeek(t.targetDate);
        }
        return '';
      }
      function shortDone(t) {
        if (t.targetDate) return fmtMD(t.targetDate);
        if (t.fuzzyTag && FUZZY_META[t.fuzzyTag]) return FUZZY_META[t.fuzzyTag].label;
        return '琐事';
      }

      /* ---------- GitHub Gist 双向增量合并 ---------- */
      function ghFetch(path, opts) {
        opts = opts || {};
        var headers = {
          'Accept': 'application/vnd.github+json',
          'Authorization': 'Bearer ' + String(S.settings.githubToken || '').trim(),
          'Content-Type': 'application/json'
        };
        if (opts.headers) {
          Object.keys(opts.headers).forEach(function (k) { headers[k] = opts.headers[k]; });
        }
        return fetch('https://api.github.com' + path, {
          method: opts.method || 'GET',
          headers: headers,
          body: opts.body
        }).then(function (res) {
          if (!res.ok) {
            return res.text().then(function (txt) {
              var msg = 'HTTP ' + res.status;
              try {
                var j = JSON.parse(txt);
                if (j && j.message) msg += '：' + j.message;
              } catch (e) {}
              var err = new Error(msg);
              err.status = res.status;
              throw err;
            });
          }
          return res.json();
        });
      }

      function syncPayload(list) {
        return {
          app: 'chrononote',
          schema: 1,
          updatedAt: Date.now(),
          count: list.length,
          tasks: JSON.parse(JSON.stringify(list))
        };
      }

      function parseRemoteTasks(data) {
        if (!data) return [];
        if (Array.isArray(data)) return data.map(normalizeTask).filter(Boolean);
        if (Array.isArray(data.tasks)) return data.tasks.map(normalizeTask).filter(Boolean);
        return [];
      }

      /** 严格按 updatedAt 取新；时间戳相同则优先保留删除态，其次保留备注更多的一方 */
      function mergeTasks(local, remote) {
        var map = new Map();
        local.forEach(function (t) { map.set(t.id, t); });
        remote.forEach(function (r) {
          var l = map.get(r.id);
          if (!l) { map.set(r.id, r); return; }
          var lu = Number(l.updatedAt) || 0, ru = Number(r.updatedAt) || 0;
          if (ru > lu) { map.set(r.id, r); return; }
          if (ru < lu) return;
          if (r.deleted && !l.deleted) { map.set(r.id, r); return; }
          if (l.deleted && !r.deleted) return;
          if ((r.notes ? r.notes.length : 0) > (l.notes ? l.notes.length : 0)) map.set(r.id, r);
        });
        return Array.from(map.values());
      }

      function doSync(silent) {
        var token = String(S.settings.githubToken || '').trim();
        if (!token) {
          if (!silent) { S.settingsOpen = true; toast('请先在设置里填写 GitHub Token', true); }
          return Promise.resolve();
        }
        if (S.syncing) return Promise.resolve();
        S.syncing = true;
        S.sync = { state: 'syncing', at: S.sync.at, message: '正在与 Gist 同步…' };
        var gid = String(S.settings.gistId || '').trim();
        var remoteTasks = null;

        var pull = gid
          ? ghFetch('/gists/' + gid).then(function (data) {
              var file = (data.files && (data.files['tasks.json'] || data.files['chrononote.json'])) || null;
              if (!file) return [];
              if (file.truncated || !file.content) {
                if (!file.raw_url) return [];
                return fetch(file.raw_url).then(function (r) { return r.text(); }).then(function (txt) {
                  return parseRemoteTasks(JSON.parse(txt));
                });
              }
              return parseRemoteTasks(JSON.parse(file.content));
            })
          : Promise.resolve(null);

        return pull.then(function (remote) {
          remoteTasks = remote;
          var merged;
          if (gid) {
            merged = mergeTasks(S.tasks.slice(), remoteTasks || []);
          } else {
            merged = S.tasks.slice();
          }
          suppressAutoSync = true;
          S.tasks = merged;
          nextTick(function () { suppressAutoSync = false; });
          return persisted();
          function persisted() {
            return db.setItem(DB_KEY, JSON.parse(JSON.stringify(merged)));
          }
        }).then(function () {
          var content = JSON.stringify(syncPayload(S.tasks), null, 2);
          if (!gid) {
            return ghFetch('/gists', {
              method: 'POST',
              body: JSON.stringify({
                description: 'ChronoNote · 私密同步备份',
                public: false,
                files: { 'tasks.json': { content: content } }
              })
            }).then(function (created) {
              if (!created || !created.id) throw new Error('创建 Gist 失败');
              S.settings.gistId = created.id;
              saveCfg();
              return created;
            });
          }
          return ghFetch('/gists/' + gid, {
            method: 'PATCH',
            body: JSON.stringify({ files: { 'tasks.json': { content: content } } })
          });
        }).then(function () {
          S.syncing = false;
          S.sync = { state: 'ok', at: Date.now(), message: '已同步 ' + hhmm(Date.now()) };
          dirtySinceSync = false;
          if (!silent) toast('同步完成 · ' + S.tasks.filter(function (t) { return !t.deleted; }).length + ' 条记录');
        }).catch(function (err) {
          S.syncing = false;
          var msg = err && err.message ? err.message : '未知错误';
          if (err && err.status === 401) msg = 'Token 无效或已过期（401）';
          if (err && err.status === 404) msg = 'Gist 不存在或已被删除（404），请清空 Gist ID 后重试';
          if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) msg = '网络请求失败，请检查网络或代理';
          S.sync = { state: 'error', at: Date.now(), message: msg };
          if (!silent) toast('同步失败：' + msg, true);
        });
      }

      function testGithub() {
        if (!S.settings.githubToken) { toast('请先填写 Token', true); return; }
        S.testingGh = true;
        S.ghStatus = { tone: '', text: '检测中…' };
        ghFetch('/user').then(function (u) {
          S.ghStatus = { tone: 'ok', text: 'Token 有效 · 已登录 ' + (u.login || '') };
          if (!String(S.settings.gistId || '').trim()) {
            S.ghStatus.text += ' · 首次同步会自动创建私密 Gist';
          }
        }).catch(function (e) {
          S.ghStatus = { tone: 'err', text: '检测失败：' + (e && e.message ? e.message : '未知错误') };
        }).then(function () { S.testingGh = false; });
      }

      function syncClick() {
        if (!String(S.settings.githubToken || '').trim()) {
          S.settingsOpen = true;
          toast('先配置 GitHub Token 与 Gist，即可双端无损同步', true);
          return;
        }
        doSync(false);
      }

      /* ---------- 导入导出 ---------- */
      function exportJson() {
        var payload = syncPayload(S.tasks);
        payload.exportedAt = new Date().toISOString();
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        var d = new Date();
        var stamp = '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
        a.href = URL.createObjectURL(blob);
        a.download = 'chrononote-backup-' + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
        toast('已导出 ' + S.tasks.length + ' 条记录');
      }

      function importJson(e) {
        var file = e && e.target && e.target.files && e.target.files[0];
        if (e && e.target) e.target.value = '';
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var data = JSON.parse(String(reader.result));
            var incoming = parseRemoteTasks(data);
            if (!incoming.length) { toast('文件里没有可导入的事项', true); return; }
            var merged = mergeTasks(S.tasks.slice(), incoming);
            S.tasks = merged;
            persistNow();
            toast('已合并 ' + incoming.length + ' 条记录，当前共 ' + merged.length + ' 条');
          } catch (err) {
            toast('导入失败：' + (err && err.message ? err.message : 'JSON 解析错误'), true);
          }
        };
        reader.onerror = function () { toast('文件读取失败', true); };
        reader.readAsText(file);
      }

      function wipeAll() {
        askConfirm({
          title: '清空全部数据？',
          body: '将删除本机保存的所有事项与备注图片（云端 Gist 不会自动删除，下次同步可能拉回）。此操作不可撤销。',
          okText: '确认清空',
          danger: true,
          onOk: function () {
            S.tasks = [];
            persistNow();
            toast('本地数据已清空');
          }
        });
      }

      /* ---------- 跨周防遗忘 ---------- */
      function checkWeek() {
        var wk = isoWeekKey(new Date());
        S.isoWeek = wk;
        var last = getLastWeek();
        var pending = S.tasks.filter(function (t) {
          return !t.deleted && !t.completed && t.timeType === 'fuzzy' && t.fuzzyTag === 'next_week';
        });
        if (last && last !== wk && pending.length) {
          S.banner = { show: true, count: pending.length };
        } else if (last !== wk) {
          setLastWeek(wk);
        }
      }
      function promoteNextWeek() {
        var now = Date.now(), n = 0;
        S.tasks.forEach(function (t) {
          if (!t.deleted && !t.completed && t.timeType === 'fuzzy' && t.fuzzyTag === 'next_week') {
            t.fuzzyTag = 'this_week';
            t.updatedAt = now;
            n++;
          }
        });
        S.banner.show = false;
        setLastWeek(isoWeekKey(new Date()));
        toast('已把 ' + n + ' 个事项移入【本周】');
      }
      function dismissBanner() {
        S.banner.show = false;
        setLastWeek(isoWeekKey(new Date()));
      }

      /* ---------- 设置弹窗 ---------- */
      function openSettings() { S.settingsOpen = true; }
      function closeSettings() { S.settingsOpen = false; }

      /* ---------- 生命周期 ---------- */
      var importEl = ref(null);
      function triggerImport() { if (importEl.value) importEl.value.click(); }

      var tickTimer = null;
      function refreshNow() {
        var t = isoToday();
        if (t !== S.today) S.today = t;
        var wk = isoWeekKey(new Date());
        if (wk !== S.isoWeek) { S.isoWeek = wk; checkWeek(); }
      }

      onMounted(function () {
        loadCfg();
        db.getItem(DB_KEY).then(function (raw) {
          if (Array.isArray(raw)) {
            S.tasks = raw.map(normalizeTask).filter(Boolean);
          }
        }).catch(function (e) {
          console.error('[ChronoNote] 读取失败', e);
        }).then(function () {
          S.ready = true;
          if (gcTombstones()) persistNow();
          checkWeek();
          if (String(S.settings.githubToken || '').trim() && String(S.settings.gistId || '').trim()) {
            doSync(true);
          }
        });

        /* 本地改动 → 落盘；已配置同步时 8 秒静默防抖推送（同步自身的写回已屏蔽） */
        var autoSyncTimer = null;
        function scheduleAutoSync() {
          clearTimeout(autoSyncTimer);
          if (!String(S.settings.githubToken || '').trim()) return;
          if (!String(S.settings.gistId || '').trim()) return;
          autoSyncTimer = setTimeout(function tick() {
            if (S.syncing) { autoSyncTimer = setTimeout(tick, 4000); return; }
            doSync(true);
          }, 8000);
        }
        watch(function () { return S.tasks; }, function () {
          scheduleSave();
          if (suppressAutoSync) return;
          dirtySinceSync = true;
          scheduleAutoSync();
        }, { deep: true });
        watch(function () { return S.settings.deepseekApiKey; }, saveCfg);
        watch(function () { return S.settings.githubToken; }, saveCfg);
        watch(function () { return S.settings.gistId; }, saveCfg);
        watch(function () { return G.pending; }, function (n) {
          document.title = (n ? '(' + n + ') ' : '') + 'ChronoNote';
        }, { immediate: true });

        tickTimer = setInterval(refreshNow, 30000);

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            refreshNow();
            persistNow();
            return;
          }
          /* 切后台/锁屏：先把墓碑上的大图摘掉再推，避免把废弃 Base64 传上云 */
          stripAllDeletedNotes();
          persistNow();
          if (dirtySinceSync &&
              String(S.settings.githubToken || '').trim() &&
              String(S.settings.gistId || '').trim()) {
            doSync(true);
          }
        });
        window.addEventListener('pagehide', function () { persistNow(); });
        window.addEventListener('beforeunload', function () { persistNow(); });
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          if (S.lightbox) { closeLightbox(); return; }
          if (S.confirm.open) { closeConfirm(); return; }
          if (S.picker.open) { closePicker(); return; }
          if (S.settingsOpen) { closeSettings(); return; }
        });
      });

      /* ---------- 对外 API ---------- */
      var A = {
        toggleTask: toggleTask,
        restoreTask: restoreTask,
        removeTask: removeTask,
        clearCompleted: clearCompleted,
        toggleExpand: toggleExpand,
        addNote: addNote,
        addNotes: addNotes,
        deleteNote: deleteNote,
        ingestImages: ingestImages,
        openLightbox: openLightbox,
        closeLightbox: closeLightbox,
        deleteLightbox: deleteLightbox,
        downloadLightbox: downloadLightbox,
        openPicker: openPicker,
        openComposerPicker: openComposerPicker,
        closePicker: closePicker,
        onPick: onPick,
        clearOverride: clearOverride,
        fillDraft: fillDraft,
        send: send,
        addToday: addToday,
        removeDraftImage: removeDraftImage,
        runAI: runAI,
        metaHint: metaHint,
        shortDone: shortDone,
        hostOf: hostOf,
        toast: toast,
        runToastAction: runToastAction,
        syncClick: syncClick,
        doSync: doSync,
        testGithub: testGithub,
        exportJson: exportJson,
        importJson: importJson,
        triggerImport: triggerImport,
        wipeAll: wipeAll,
        promoteNextWeek: promoteNextWeek,
        dismissBanner: dismissBanner,
        openSettings: openSettings,
        closeSettings: closeSettings,
        askConfirm: askConfirm,
        closeConfirm: closeConfirm,
        confirmOk: confirmOk
      };

      var syncStateC = computed(function () {
        if (S.syncing || S.sync.state === 'syncing') return 'syncing';
        if (S.sync.state === 'error') return 'error';
        if (!String(S.settings.githubToken || '').trim()) return 'off';
        if (S.sync.state === 'ok') return 'ok';
        return 'idle';
      });
      var syncTextC = computed(function () {
        if (S.syncing) return '同步中';
        if (S.sync.state === 'error') return '同步失败';
        if (!String(S.settings.githubToken || '').trim()) return '未连接';
        if (S.sync.at) return '已同步 ' + hhmm(S.sync.at);
        return '待同步';
      });

      provide('S', S);
      provide('G', G);
      provide('A', A);

      return {
        S: S, G: G, A: A,
        syncState: syncStateC,
        syncText: syncTextC,
        fuzzyOrder: FUZZY_ORDER,
        fuzzyMeta: FUZZY_META,
        fuzzyMetaOf: fuzzyMetaOf,
        importEl: importEl
      };
    },
    template: '#tpl-app'
  };

  /* ==========================================================================
   * 10. 挂载
   * ======================================================================== */
  var app = createApp(ChronoApp);
  app.component('icon', IconComp);
  app.component('task-card', TaskCard);
  app.component('composer-box', ComposerBox);
  app.component('time-menu', TimeMenu);
  app.mount('#app');

  window.__chrononote = { version: '1.2.1', parseNatural: parseNatural, parseDraft: parseDraft };
})();
</script>
</body>
</html>
